<!doctype html>
<!-- 全景图查看器 / Panorama Viewer v1.1.0 —— 单文件、零依赖、纯前端 WebGL 全景查看工具
     作者：金钻、苏达，及本项目全体贡献者们 · 以 MIT 协议开源（见 LICENSE） -->
<html lang="zh-CN" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>全景图查看器 · 在线全景图查看工具</title>
<meta name="description" content="在浏览器里看全景图的免费小工具：球面 / 立方体 / 圆柱三种包裹样式，可拖动环视、缩放，并调节曝光、对比度、饱和度、色温、暗角、锐度、水平校正等参数。图片全程在你的设备上处理，不上传、不联网。">
<meta name="robots" content="index,follow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b0d0e'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%233ecf8e' stroke-width='2.4'/%3E%3Cellipse cx='16' cy='16' rx='9' ry='3.6' fill='none' stroke='%233ecf8e' stroke-width='1.4' opacity='.65'/%3E%3C/svg%3E">
<!--
  全景图查看器 · 单文件 · 零依赖 · MIT
  ---------------------------------------------------------------------------
  一个纯前端全景（等距柱状 / 2:1）查看器：
    · 三种包裹样式：球面（默认）/ 立方体 / 圆柱
    · 拖动环视、滚轮 / 双指缩放、双击复位、键盘可操作
    · 曝光 / 对比度 / 饱和度 / 色温 / 暗角 / 锐度 / 水平校正 实时可调
    · 导出当前视角为 PNG，随时还原原始参数
    · 全部计算在本地（WebGL），图片不进网络：没有上传接口、没有埋点、没有外部请求
  实现：原生 WebGL（GLSL ES 1.00，WebGL1 / WebGL2 通用），一个全屏四边形 + 一个片元着色器。
  下载后可离线使用：所有资源内联，直接双击打开即可（file:// 也能跑）。
  许可：MIT。作者与出处信息请按你的需要自行替换（本文件不含任何私有域名与个人信息）。
-->
<style>
/* ==========================================================================
   外观 · 中性玻璃（glassmorphism）
   亮 / 暗两套变量；默认跟随系统，顶栏「◐」可手动固定
   ========================================================================== */
:root{
  --bg:#0C1017; --bg-soft:#151A24;
  --glass:rgba(22,27,36,.62); --glass-2:rgba(31,37,48,.74);
  --stroke:rgba(255,255,255,.10); --stroke-2:rgba(255,255,255,.18);
  --ink:#EDF0F5; --ink-2:#A9B2C1; --ink-3:#7B8597;
  --acc:#7AA2FF; --acc-ink:#08101F; --acc-glow:rgba(122,162,255,.35);
  --sheen:rgba(255,255,255,.10);
  --wash-a:rgba(122,162,255,.16); --wash-b:rgba(150,140,255,.14);
  --shadow:0 20px 44px -26px rgba(0,0,0,.78);
  --blur:blur(18px) saturate(150%);
  --r-xl:22px; --r-lg:16px; --r:12px; --r-sm:9px;
  --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,sans-serif;
  --s2:8px; --s3:12px; --s4:16px; --s5:24px;
  --ease:cubic-bezier(.2,.8,.2,1);
  --d-press:90ms; --d-hover:160ms; --d-pop:200ms; --d-modal:240ms; --d-exit:180ms;
}
@media (prefers-color-scheme: light){
  :root{
    --bg:#EEF1F6; --bg-soft:#F7F9FC;
    --glass:rgba(255,255,255,.62); --glass-2:rgba(255,255,255,.80);
    --stroke:rgba(16,24,40,.08); --stroke-2:rgba(16,24,40,.16);
    --ink:#101828; --ink-2:#475467; --ink-3:#667085;
    --acc:#3B6EF6; --acc-ink:#FFFFFF; --acc-glow:rgba(59,110,246,.30);
    --sheen:rgba(255,255,255,.55);
    --wash-a:rgba(59,110,246,.10); --wash-b:rgba(120,110,230,.09);
    --shadow:0 20px 44px -28px rgba(16,24,40,.38);
  }
}
[data-theme="light"]{
  --bg:#EEF1F6; --bg-soft:#F7F9FC;
  --glass:rgba(255,255,255,.62); --glass-2:rgba(255,255,255,.80);
  --stroke:rgba(16,24,40,.08); --stroke-2:rgba(16,24,40,.16);
  --ink:#101828; --ink-2:#475467; --ink-3:#667085;
  --acc:#3B6EF6; --acc-ink:#FFFFFF; --acc-glow:rgba(59,110,246,.30);
  --sheen:rgba(255,255,255,.55);
  --shadow:0 20px 44px -28px rgba(16,24,40,.38);
}
[data-theme="dark"]{
  --bg:#0C1017; --bg-soft:#151A24;
  --glass:rgba(22,27,36,.62); --glass-2:rgba(31,37,48,.74);
  --stroke:rgba(255,255,255,.10); --stroke-2:rgba(255,255,255,.18);
  --ink:#EDF0F5; --ink-2:#A9B2C1; --ink-3:#7B8597;
  --acc:#7AA2FF; --acc-ink:#08101F; --acc-glow:rgba(122,162,255,.35);
  --sheen:rgba(255,255,255,.10);
  --wash-a:rgba(122,162,255,.16); --wash-b:rgba(150,140,255,.14);
  --shadow:0 20px 44px -26px rgba(0,0,0,.78);
}

*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--bg); color:var(--ink);
  font:14px/1.6 var(--font); -webkit-font-smoothing:antialiased; overscroll-behavior:none;
}
body.dragging{cursor:grabbing}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;background:var(--bg)}
#gl.hidden{display:none}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------------- 顶栏 ---------------- */
#bar{
  position:fixed;left:0;right:0;top:0;z-index:20;display:flex;align-items:center;gap:var(--s2);
  padding:calc(env(safe-area-inset-top,0px) + 10px) var(--s3) 12px;
  background:linear-gradient(to bottom,var(--glass) 0%,var(--glass) 55%,transparent 100%);
  backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);pointer-events:none;
}
#bar > *{pointer-events:auto}
#brand{display:flex;align-items:center;gap:9px;margin-right:auto;min-width:0}
#brand b{font:650 15px/1.2 var(--font);letter-spacing:.01em;white-space:nowrap;color:var(--ink)}
#brand .sb{width:6px;height:6px;border-radius:50%;background:var(--acc);flex:none;
  box-shadow:0 0 0 4px var(--acc-glow)}
#brand i{font-style:normal;font-size:10.5px;color:var(--ink-3);letter-spacing:.14em;text-transform:uppercase;white-space:nowrap}
@media (max-width:560px){ #brand i{display:none} }

/* ---------------- 按钮：玻璃底 + 实心强调 ---------------- */
.btn{
  position:relative;display:inline-flex;align-items:center;justify-content:center;gap:6px;
  height:38px;padding:0 15px;border-radius:var(--r);font:600 13.5px/1 var(--font);
  color:var(--ink);cursor:pointer;white-space:nowrap;overflow:hidden;
  background:var(--glass);border:1px solid var(--stroke-2);
  backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  box-shadow:inset 0 1px 0 var(--sheen), var(--shadow);
  transition:background var(--d-hover) var(--ease),transform var(--d-press) var(--ease),
             border-color var(--d-hover) var(--ease),box-shadow var(--d-hover) var(--ease);
}
.btn:hover{background:var(--glass-2);border-color:var(--acc)}
.btn:active{transform:scale(.97)}
.btn:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.btn.pri{background:var(--acc);color:var(--acc-ink);border-color:transparent;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 12px 26px -14px var(--acc-glow)}
.btn.pri:hover{filter:brightness(1.06)}
.btn.icon{width:38px;padding:0}
.btn[aria-disabled="true"]{opacity:.5;pointer-events:none}
/* 按压时的一抹高光（跟指针走；只写 CSS 变量，不动 DOM） */
.btn::after{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:0;
  background:radial-gradient(80px circle at var(--mx,50%) var(--my,50%),var(--sheen),transparent 70%);
  transition:opacity 420ms var(--ease);
}
.btn.lit::after{opacity:1;transition-duration:0ms}

/* ---------------- 空状态：一张玻璃卡片 ---------------- */
#empty{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;
  padding:var(--s4);text-align:center;overflow:hidden}
#empty.in{display:none}
#empty::before{
  content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(46% 42% at 22% 18%, var(--wash-a) 0%, transparent 70%),
    radial-gradient(44% 40% at 78% 84%, var(--wash-b) 0%, transparent 72%);
}
#drop{
  position:relative;width:min(480px,100%);
  padding:clamp(22px,5vw,34px) clamp(20px,5vw,34px) clamp(20px,5vw,28px);
  border-radius:var(--r-xl);border:1px solid var(--stroke-2);
  background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  box-shadow:inset 0 1px 0 var(--sheen), var(--shadow);
  transition:border-color var(--d-pop) var(--ease),transform var(--d-pop) var(--ease),box-shadow var(--d-pop) var(--ease);
}
#drop.hot{border-color:var(--acc);transform:scale(1.012);box-shadow:inset 0 1px 0 var(--sheen),var(--shadow),0 0 0 5px var(--acc-glow)}
.mark{display:inline-flex;align-items:center;justify-content:center;width:52px;height:52px;margin:2px auto 14px;
  border-radius:15px;border:1px solid var(--stroke-2);background:var(--glass-2);
  backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  box-shadow:inset 0 1px 0 var(--sheen)}
.mark svg{width:27px;height:27px;stroke:var(--acc);fill:none;stroke-width:1.7;stroke-linecap:round}
.tag-l{display:inline-flex;align-items:center;gap:7px;height:28px;padding:0 12px;border-radius:999px;
  border:1px solid var(--stroke);background:var(--glass-2);font:600 12px/1 var(--font);color:var(--ink-2)}
.tag-l i{width:5px;height:5px;border-radius:50%;background:var(--acc);flex:none}
#drop h1{margin:14px 0 0;font:650 clamp(20px,5.6vw,26px)/1.3 var(--font);letter-spacing:-.01em;color:var(--ink)}
#drop p{margin:10px 0 0;color:var(--ink-3);font-size:13px;line-height:1.8}
#drop .acts{display:flex;gap:10px;justify-content:center;margin-top:var(--s5);flex-wrap:wrap}
#drop .meta{margin-top:var(--s4);padding-top:var(--s3);border-top:1px solid var(--stroke);
  font-size:11.5px;color:var(--ink-3);line-height:1.85;text-align:left}
#drop .meta b{color:var(--ink-2);font-weight:600}

/* ---------------- 底部分段控件 ---------------- */
#bottom{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;align-items:flex-end;gap:var(--s2);flex-wrap:wrap;
  padding:var(--s3) var(--s3) calc(env(safe-area-inset-bottom,0px) + 12px);pointer-events:none}
#bottom > *{pointer-events:auto}
#bottom .spacer{flex:1 1 auto;min-width:0}
.seg{display:flex;gap:2px;padding:4px;border-radius:14px;border:1px solid var(--stroke-2);
  background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  box-shadow:inset 0 1px 0 var(--sheen),var(--shadow)}
.seg button{position:relative;border:0;background:transparent;color:var(--ink-3);font:600 12.5px/1 var(--font);
  height:30px;padding:0 13px;border-radius:10px;cursor:pointer;white-space:nowrap;
  transition:background var(--d-hover) var(--ease),color var(--d-hover) var(--ease),box-shadow var(--d-hover) var(--ease)}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--acc);color:var(--acc-ink);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 8px 18px -12px var(--acc-glow)}
.seg button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}

#hint{position:fixed;left:50%;transform:translateX(-50%);z-index:15;
  bottom:calc(env(safe-area-inset-bottom,0px) + 62px);padding:6px 13px;border-radius:999px;
  font-size:11.5px;color:var(--ink-2);background:var(--glass);border:1px solid var(--stroke);
  backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  white-space:nowrap;opacity:0;transition:opacity var(--d-modal) var(--ease);pointer-events:none}
#hint.on{opacity:1}

#map{position:fixed;left:var(--s3);bottom:calc(env(safe-area-inset-bottom,0px) + 64px);z-index:16;
  width:min(38vw,260px);border-radius:var(--r-sm);overflow:hidden;border:1px solid var(--stroke-2);
  background:var(--glass-2);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);line-height:0;
  box-shadow:var(--shadow);
  transition:opacity var(--d-pop) var(--ease),transform var(--d-pop) var(--ease)}
#map.hide{opacity:0;transform:translateY(6px);pointer-events:none}
@media (max-width:560px){ #map{width:42vw} }

/* ---------------- 参数抽屉 ---------------- */
#mask{position:fixed;inset:0;z-index:30;background:rgba(8,11,18,.44);opacity:0;visibility:hidden;
  backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);
  transition:opacity var(--d-exit) var(--ease),visibility 0s linear var(--d-exit)}
#mask.on{opacity:1;visibility:visible;transition:opacity var(--d-modal) var(--ease),visibility 0s}
#panel{position:fixed;z-index:31;left:var(--s3);right:var(--s3);
  bottom:calc(env(safe-area-inset-bottom,0px) + 62px);max-width:480px;margin-left:auto;
  background:var(--glass-2);border:1px solid var(--stroke-2);border-radius:var(--r-xl);
  backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  box-shadow:inset 0 1px 0 var(--sheen),var(--shadow);
  padding:var(--s4) var(--s4) 0;max-height:min(80vh,660px);overflow-y:auto;
  opacity:0;transform:translateY(10px) scale(.985);visibility:hidden;
  transition:opacity var(--d-exit) var(--ease),transform var(--d-exit) var(--ease),visibility 0s linear var(--d-exit)}
#panel.on{opacity:1;transform:none;visibility:visible;
  transition:opacity var(--d-modal) var(--ease),transform var(--d-modal) var(--ease),visibility 0s}
#panel h2{margin:0;font:650 14.5px/1.2 var(--font);color:var(--ink)}
#panel .sub{margin:8px 0 var(--s3);font-size:11.5px;color:var(--ink-3)}
.row{display:grid;grid-template-columns:64px 1fr 44px;align-items:center;gap:var(--s3);padding:3px 0}
.row label{font-size:12.5px;color:var(--ink-2);font-weight:500}
.row output{font-size:11.5px;color:var(--ink-3);text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:22px;background:transparent;cursor:pointer;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:999px;background:var(--stroke-2)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;margin-top:-5.5px;border-radius:50%;
  background:#fff;border:1px solid var(--stroke-2);
  box-shadow:0 2px 8px -2px rgba(16,24,40,.5),inset 0 1px 0 #fff;
  transition:transform var(--d-press) var(--ease)}
input[type=range]:active::-webkit-slider-thumb{transform:scale(1.14)}
input[type=range]::-moz-range-track{height:4px;border-radius:999px;background:var(--stroke-2)}
input[type=range]::-moz-range-thumb{width:15px;height:15px;border:1px solid var(--stroke-2);border-radius:50%;background:#fff}
input[type=range]:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:4px}
#panel .grid2{display:grid;grid-template-columns:1fr 1fr;gap:var(--s2);margin-top:var(--s3)}
#panel .foot{position:sticky;bottom:0;display:flex;gap:var(--s2);flex-wrap:wrap;
  padding:var(--s3) 0 var(--s4);margin-top:var(--s2);
  background:linear-gradient(to top,var(--bg-soft) 62%,transparent)}
#panel hr{border:0;border-top:1px solid var(--stroke);margin:var(--s3) 0 0}

#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 108px);transform:translate(-50%,6px);
  z-index:40;padding:8px 15px;border-radius:12px;font-size:12.5px;font-weight:600;
  background:var(--glass-2);border:1px solid var(--stroke-2);color:var(--ink);
  backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  box-shadow:inset 0 1px 0 var(--sheen),var(--shadow);
  opacity:0;visibility:hidden;
  transition:opacity var(--d-pop) var(--ease),transform var(--d-pop) var(--ease),visibility 0s linear var(--d-pop);
  pointer-events:none;max-width:86vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0);visibility:visible;
  transition:opacity var(--d-pop) var(--ease),transform var(--d-pop) var(--ease),visibility 0s}

@media (prefers-reduced-motion: reduce){ *{transition-duration:1ms !important} }
</style>
</head>
<body>

<canvas id="gl" class="hidden"></canvas>

<header id="bar">
  <span id="brand"><b>全景图查看器</b><span class="sb" aria-hidden="true"></span><i>Panorama Viewer</i></span>
  <a class="btn" id="back" href="../">← 返回</a>
  <button class="btn" id="btnPick" type="button">换一张</button>
  <button class="btn icon" id="btnReset" type="button" title="复位视角（R）" aria-label="复位视角">⤾</button>
  <button class="btn icon" id="btnTheme" type="button" title="外观：跟随系统 / 亮 / 暗" aria-label="切换外观">◐</button>
  <button class="btn icon" id="btnFull" type="button" title="全屏（F）" aria-label="全屏">⛶</button>
</header>

<div id="empty">
  <div id="drop">
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="9" ry="3.6" opacity=".5"/></svg>
    </div>
    <span class="tag-l"><i></i>零上传 · 本地计算</span>
    <h1>把全景图拖进来</h1>
    <p>等距柱状（2:1）的全景图最合适；也可以直接按 Ctrl / ⌘ + V 粘贴、或用下面的按钮选一张。</p>
    <div class="acts">
      <button class="btn pri" id="btnChoose" type="button">选择本地图片</button>
      <button class="btn" id="btnDemo" type="button">先看看示例</button>
    </div>
    <div class="meta">
      <b>图片不会离开这台设备。</b>所有读取、投影、调色都在你自己的浏览器里算，没有上传接口、没有埋点、没有任何外部请求——断网也能用。
    </div>
  </div>
</div>

<canvas id="map" class="hide" width="512" height="256" aria-hidden="true"></canvas>

<div id="bottom">
  <div class="seg" id="modes" role="group" aria-label="包裹样式">
    <button type="button" data-m="sphere" aria-pressed="true">球面</button>
    <button type="button" data-m="cube" aria-pressed="false">立方体</button>
    <button type="button" data-m="cyl" aria-pressed="false">圆柱</button>
  </div>
  <div class="spacer"></div>
  <button class="btn" id="btnPanel" type="button" aria-expanded="false">参数</button>
</div>

<div id="hint">拖动环视 · 滚轮 / 双指缩放 · 双击复位</div>

<div id="mask"></div>

<section id="panel" role="dialog" aria-label="画面参数" aria-modal="false">
  <h2>画面参数</h2>
  <p class="sub">拖动滑块即时生效；「还原」把这一组恢复默认，不影响视角。</p>
  <div id="sliders"></div>
  <hr>
  <div class="grid2">
    <button class="btn" id="btnAuto" type="button" aria-pressed="false">自动旋转</button>
    <button class="btn" id="btnMap" type="button" aria-pressed="false">展开图导航</button>
  </div>
  <div class="foot">
    <button class="btn" id="btnRestore" type="button">还原</button>
    <button class="btn" id="btnSave" type="button">导出 PNG</button>
    <button class="btn" id="btnSrc" type="button">下载源码</button>
  </div>
</section>

<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="file" accept="image/*,.hdr" class="visually-hidden" aria-hidden="true" tabindex="-1">

<script>
(function () {
  'use strict';

  /* ======================================================================
     0. 小工具
     ====================================================================== */
  var $ = function (s) { return document.querySelector(s); };
  var clamp = function (v, a, b) { return v < a ? a : (v > b ? b : v); };
  var reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

  var toastEl = $('#toast'), toastT = 0;
  function toast(msg, ms) {
    toastEl.textContent = msg; toastEl.classList.add('on');
    clearTimeout(toastT); toastT = setTimeout(function () { toastEl.classList.remove('on'); }, ms || 1900);
  }

  /* ======================================================================
     1. 状态
     ====================================================================== */

  /* ---------------- HDR（Radiance RGBE .hdr）----------------
     格式：文本头（#?RADIANCE / FORMAT=32-bit_rle_rgbe）→ 空行 → 一行分辨率 → 像素数据。
     像素是每像素 4 字节 R,G,B,E；E 是指数：线性色 = RGB * 2^(E-128)。
     上传时直接塞进 RGBA8 纹理（A 字节放 E），解码在着色器里做 —— 这样不用浮点纹理也能看 HDR。 */

      p++;

    var m = /^([-+])([XY])\s+(\d+)\s+([-+])([XY])\s+(\d+)/.exec(line());

    /* 注意：数字属于它前面那个轴 —— "-Y 512 +X 1024" = 高 512、宽 1024 */

    var w = parseInt(m[2] === 'X' ? a1 : a2, 10);

    var flipY = (m[1] === '+'), flipX = (m[4] === '-');

    for (var y = 0; y < h; y++) {
      var row = flipY ? (h - 1 - y) : y;

      if (w >= 8 && w < 32768 && b[p] === 2 && b[p + 1] === 2 && ((b[p + 2] << 8) | b[p + 3]) === w) {
        p += 4;
        for (var c = 0; c < 4; c++) {
          var x = 0;
          while (x < w) {
            var n = b[p++];
            if (n > 128) { n -= 128; var v = b[p++]; while (n-- > 0) { scan[x * 4 + c] = v; x++; } }
            else { while (n-- > 0) { scan[x * 4 + c] = b[p++]; x++; } }

        out[t] = out[u]; out[t+1] = out[u+1]; out[t+2] = out[u+2]; out[t+3] = out[u+3];

  });
  addEventListener('paste', function (e) {
    var items = (e.clipboardData && e.clipboardData.items) || [];
    for (var i = 0; i < items.length; i++) {
      if (items[i].type && items[i].type.indexOf('image') === 0) { loadFile(items[i].getAsFile()); return; }
    }
  });

  /* ======================================================================
     9. 导出 / 下载源码 / 外观
     ====================================================================== */
  $('#btnSave').addEventListener('click', function () {
    if (!S.hasImage) { toast('先载入一张图'); return; }
    draw();
    try {
      var url = canvas.toDataURL('image/png');
      var a = document.createElement('a');
      a.href = url; a.download = 'panorama-' + S.mode + '-' + Date.now() + '.png';
      document.body.appendChild(a); a.click(); a.remove();
      toast('已导出这一屏（本地生成，没联网）');
    } catch (err) { toast('导出失败：' + (err && err.message ? err.message : err)); }
  });

  /* 单独下载成文件打开时（file://），「← 返回」没有上一级页面可去 → 直接隐掉 */
  if (location.protocol === 'file:') { var bk = document.getElementById('back'); if (bk) bk.style.display = 'none'; }

  $('#btnSrc').addEventListener('click', function () {
    fetch(location.href).then(function (r) { return r.text(); }).then(function (t) {
      var a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([t], { type: 'text/html;charset=utf-8' }));
      a.download = 'panorama-viewer.html';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
      toast('单文件源码已下载（拖进浏览器就能用）');
    }, function () { toast('源码取得失败，可在页面里直接「查看源代码」'); });
  });

  /* 按压发光：光跟指针走、按下即亮、松手慢慢收；只写 CSS 变量，不插 DOM */
  document.addEventListener('pointerdown', function (e) {
    var t = e.target;
    var el = t && t.closest ? t.closest('.btn, .seg button') : null;
    if (!el || el.getAttribute('aria-disabled') === 'true') return;
    var r = el.getBoundingClientRect();
    el.style.setProperty('--mx', ((e.clientX - r.left) / Math.max(1, r.width) * 100) + '%');
    el.style.setProperty('--my', ((e.clientY - r.top) / Math.max(1, r.height) * 100) + '%');
    el.classList.add('lit');
    setTimeout(function () { el.classList.remove('lit'); }, 30);
  }, true);

  var THEMES = ['auto', 'light', 'dark'], THEME_NAME = { auto: '跟随系统', light: '亮色', dark: '暗色' };
  var theme = 'auto';
  try { theme = localStorage.getItem('pv_theme') || 'auto'; } catch (e) {}
  function applyTheme() {
    if (theme === 'auto') document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', theme);
    $('#btnTheme').title = '外观：' + THEME_NAME[theme] + '（点一下换）';
    try { localStorage.setItem('pv_theme', theme); } catch (e) {}
  }
  $('#btnTheme').addEventListener('click', function () {
    theme = THEMES[(THEMES.indexOf(theme) + 1) % THEMES.length];
    applyTheme(); toast('外观：' + THEME_NAME[theme]);
  });
  applyTheme();

  /* 下载下来的单文件（file://）里，「返回」没有上一级页面，藏起来 */
  if (location.protocol === 'file:') $('#back').style.display = 'none';

  /* ======================================================================
     10. 启动
     ====================================================================== */
  try {
    if (!initGL()) throw new Error('这台浏览器没有可用的 WebGL');
  } catch (err) {
    $('#drop').innerHTML = '<h1>打不开</h1><p>' + (err && err.message ? err.message : 'WebGL 初始化失败') +
      '。<br>换一个较新的浏览器（Chrome / Edge / Safari 15+ / Firefox）再试。</p>';
    return;
  }
  addEventListener('resize', function () { schedule(); drawMap(); }, { passive: true });
  addEventListener('orientationchange', function () { setTimeout(schedule, 200); });
  syncSliders();
  schedule();
})();
</script>
</body>
</html>
